persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_dest topic
log_type error
log_type warning
log_type notice
connection_messages true
sys_interval 10

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

# External read-only WebSocket listener. Only feed-proxy may connect here;
# PROXY protocol v2 preserves the original public client address in logs.
listener 9002 0.0.0.0
protocol websockets
enable_proxy_protocol 2
