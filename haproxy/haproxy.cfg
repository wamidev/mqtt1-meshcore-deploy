global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    timeout http-request 10s
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend feed_websocket
    bind :8080
    http-request deny deny_status 404 unless { path -i /feed }
    http-request deny deny_status 400 unless { req.hdr_ip(X-MeshCore-Client-IP) -m found }
    http-request set-src req.hdr_ip(X-MeshCore-Client-IP)
    default_backend feed_broker

backend feed_broker
    server feed-broker feed-broker:9002 send-proxy-v2
