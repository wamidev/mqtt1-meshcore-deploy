services:
  public-broker:
    image: ${MESHCORE_BROKER_IMAGE}
    restart: unless-stopped
    environment:
      MQTT_HOST: 0.0.0.0
      MQTT_WS_PORT: 8883
      AUTH_EXPECTED_AUDIENCE: ${AUTH_EXPECTED_AUDIENCE}
      OBSERVER_IP_MONITOR_SUBSCRIBER: dedup-reader
      SUBSCRIBER_MAX_CONNECTIONS_DEFAULT: 10
      SUBSCRIBER_1: "dedup-reader:${PUBLIC_BROKER_READER_PASSWORD}:2:10"
      ABUSE_ENFORCEMENT_ENABLED: ${ABUSE_ENFORCEMENT_ENABLED:-true}
      ABUSE_DUPLICATE_WINDOW_SIZE: ${ABUSE_DUPLICATE_WINDOW_SIZE:-100}
      ABUSE_DUPLICATE_WINDOW_MS: ${ABUSE_DUPLICATE_WINDOW_MS:-300000}
      ABUSE_DUPLICATE_THRESHOLD: ${ABUSE_DUPLICATE_THRESHOLD:-10}
      ABUSE_MAX_DUPLICATES_PER_PACKET: ${ABUSE_MAX_DUPLICATES_PER_PACKET:-5}
      ABUSE_DUPLICATE_RATE_THRESHOLD: ${ABUSE_DUPLICATE_RATE_THRESHOLD:-0.3}
      ABUSE_DUPLICATE_RATE_WINDOW_MS: ${ABUSE_DUPLICATE_RATE_WINDOW_MS:-300000}
      ABUSE_BUCKET_CAPACITY: ${ABUSE_BUCKET_CAPACITY:-20}
      ABUSE_BUCKET_REFILL_RATE: ${ABUSE_BUCKET_REFILL_RATE:-3}
      ABUSE_MAX_PACKET_SIZE: ${ABUSE_MAX_PACKET_SIZE:-255}
      ABUSE_MAX_TOPICS_PER_DAY: ${ABUSE_MAX_TOPICS_PER_DAY:-3}
      ABUSE_ANOMALY_THRESHOLD: ${ABUSE_ANOMALY_THRESHOLD:-10}
      ABUSE_MAX_IATA_CHANGES_24H: ${ABUSE_MAX_IATA_CHANGES_24H:-3}
      ABUSE_TOPIC_HISTORY_SIZE: ${ABUSE_TOPIC_HISTORY_SIZE:-50}
      ABUSE_TOPIC_HISTORY_WINDOW_MS: ${ABUSE_TOPIC_HISTORY_WINDOW_MS:-86400000}
      ABUSE_PERSISTENCE_PATH: /data/abuse-detection.db
      ABUSE_PERSISTENCE_INTERVAL_MS: ${ABUSE_PERSISTENCE_INTERVAL_MS:-300000}
      ABUSE_STATE_RETENTION_MS: ${ABUSE_STATE_RETENTION_MS:-604800000}
    volumes:
      - ./public-broker/data:/data
    expose:
      - "8883"
    networks: [meshcore_mqtt]

  feed-broker:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    expose:
      - "1883"
      - "9001"
      - "9002"
    environment:
      MQTT_HEALTH_PASSWORD: ${MQTT_LOCAL_DEDUP_READER_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u feed-health -P \"$${MQTT_HEALTH_PASSWORD}\" -t '$$SYS/broker/version' -C 1 -W 5 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks: [meshcore_mqtt]

  feed-proxy:
    image: haproxy:3.2.21-alpine
    restart: unless-stopped
    depends_on:
      feed-broker:
        condition: service_healthy
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks: [meshcore_mqtt]

  dedup-worker:
    image: ${DEDUP_WORKER_IMAGE}
    restart: unless-stopped
    depends_on:
      feed-broker:
        condition: service_healthy
      public-broker:
        condition: service_started
    environment:
      MQTT_SOURCE_1_URL: ${MQTT_SOURCE_1_URL}
      MQTT_SOURCE_1_USERNAME: ${MQTT_SOURCE_1_USERNAME}
      MQTT_SOURCE_1_PASSWORD: ${MQTT_SOURCE_1_PASSWORD}
      MQTT_SOURCE_2_URL: ${MQTT_SOURCE_2_URL}
      MQTT_SOURCE_2_USERNAME: ${MQTT_SOURCE_2_USERNAME}
      MQTT_SOURCE_2_PASSWORD: ${MQTT_SOURCE_2_PASSWORD}
      MQTT_TARGET_URL: ${MQTT_TARGET_URL}
      MQTT_TARGET_USERNAME: ${MQTT_TARGET_USERNAME}
      MQTT_TARGET_PASSWORD: ${MQTT_TARGET_PASSWORD}
      MQTT_INPUT_TOPIC: ${MQTT_INPUT_TOPIC:-meshcore/#}
      MQTT_OUTPUT_PREFIX: ${MQTT_OUTPUT_PREFIX:-meshcore}
      DEDUP_TTL_SECONDS: ${DEDUP_TTL_SECONDS:-600}
      DEDUP_KEY_MODE: ${DEDUP_KEY_MODE:-topic_raw}
      DEDUP_DIAGNOSTIC_PUBLIC_KEY: ${DEDUP_DIAGNOSTIC_PUBLIC_KEY:-}
      MQTT_QOS: ${MQTT_QOS:-1}
      MQTT_PUBLISH_TIMEOUT_SECONDS: ${MQTT_PUBLISH_TIMEOUT_SECONDS:-10}
      MQTT_CLIENT_ID_PREFIX: ${MQTT_CLIENT_ID_PREFIX:-meshcore-dedup}
      MONITOR_EVENTS_ENABLED: ${MONITOR_EVENTS_ENABLED:-true}
      MONITOR_TOPIC_PREFIX: ${MONITOR_TOPIC_PREFIX:-meshcore-monitor}
      MONITOR_OBSERVER_IP_SOURCE: ${MONITOR_OBSERVER_IP_SOURCE:-}
    networks: [meshcore_mqtt]

  monitor:
    image: ${MONITOR_IMAGE}
    restart: unless-stopped
    depends_on:
      feed-broker:
        condition: service_healthy
      dedup-worker:
        condition: service_started
    environment:
      MONITOR_MQTT_HOST: feed-broker
      MONITOR_MQTT_PORT: 1883
      MONITOR_MQTT_USERNAME: monitor-ro
      MONITOR_MQTT_PASSWORD: ${MONITOR_MQTT_PASSWORD}
      MONITOR_TOPIC_PREFIX: ${MONITOR_TOPIC_PREFIX:-meshcore-monitor}
      MONITOR_DB_PATH: /data/monitor.db
      MONITOR_RETENTION_DAYS: ${MONITOR_RETENTION_DAYS:-30}
      MONITOR_ACTIVE_WINDOW_SECONDS: ${MONITOR_ACTIVE_WINDOW_SECONDS:-180}
    volumes:
      - ./monitor/data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks: [meshcore_mqtt]

networks:
  meshcore_mqtt:
