services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      public-broker:
        condition: service_started
      feed-broker:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    volumes:
      - ./nginx/templates/mqtt1:/etc/nginx/templates:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header=\"Host: $${PUBLIC_DOMAIN}\" --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks: [meshcore_mqtt]
